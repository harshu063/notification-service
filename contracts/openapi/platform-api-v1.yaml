openapi: 3.1.0
info:
  title: Event Commerce Platform API
  version: 1.0.0-draft
  description: Contract-first baseline. Proposed operations are marked with x-implementation-status.
servers:
  - url: http://localhost:8080/api/v1
    description: Local API Gateway
security:
  - oidc: []
paths:
  /auth/registrations:
    post:
      operationId: registerUser
      security: []
      x-implementation-status: implemented-in-authentication-service
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201':
          description: Account created
          headers: { X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me:
    get:
      operationId: getCurrentUser
      x-implementation-status: proposed
      responses:
        '200':
          description: Current identity and permissions
          content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUser' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /products:
    get:
      operationId: listProducts
      security: []
      x-implementation-status: proposed-replacement
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: query, in: query, schema: { type: string, maxLength: 200 } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Cursor page
          content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } }
    post:
      operationId: createProduct
      x-implementation-status: proposed-replacement
      security: [ { oidc: [catalog.write] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWrite' } } }
      responses:
        '201':
          description: Product created
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getProduct
      security: []
      x-implementation-status: proposed-replacement
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProduct
      x-implementation-status: proposed-replacement
      security: [ { oidc: [catalog.write] } ]
      parameters: [ { name: If-Match, in: header, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWrite' } } }
      responses:
        '200': { description: Updated product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '412': { $ref: '#/components/responses/Conflict' }
  /orders:
    post:
      operationId: createOrder
      x-implementation-status: blocked-order-service-empty
      security: [ { oidc: [orders.write] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } }
      responses:
        '201': { description: Order created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listOwnOrders
      x-implementation-status: blocked-order-service-empty
      security: [ { oidc: [orders.read] } ]
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200': { description: Orders, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
  /orders/{orderId}:
    get:
      operationId: getOrder
      x-implementation-status: blocked-order-service-empty
      security: [ { oidc: [orders.read] } ]
      parameters: [ { name: orderId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments:
    post:
      operationId: createPaymentAttempt
      x-implementation-status: proposed-replacement
      security: [ { oidc: [payments.write] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentRequest' } } }
      responses:
        '201': { description: Payment attempt created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/{paymentId}:
    get:
      operationId: getPaymentAttempt
      x-implementation-status: proposed
      security: [ { oidc: [payments.read] } ]
      parameters: [ { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Payment state, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentAttempt' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      x-implementation-status: proposed
      security: [ { oidc: [notifications.preferences] } ]
      responses:
        '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
    patch:
      operationId: updateNotificationPreferences
      x-implementation-status: proposed
      security: [ { oidc: [notifications.preferences] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } }
      responses:
        '200': { description: Updated preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
  /notifications/events:
    get:
      operationId: searchNotificationEvents
      x-implementation-status: proposed
      security: [ { oidc: [notifications.read] } ]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Events, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationEventPage' } } } }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8081/.well-known/openid-configuration
  headers:
    CorrelationId: { description: End-to-end diagnostic identifier, schema: { type: string } }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
  responses:
    BadRequest: { description: Invalid request, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Authentication required, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Resource not found, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Idempotency or version conflict, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    RegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    RegistrationResponse:
      type: object
      required: [userId, email]
      properties:
        userId: { type: integer, format: int64 }
        email: { type: string, format: email }
    CurrentUser:
      type: object
      required: [subject, email, roles]
      properties:
        subject: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string }, uniqueItems: true }
        tenantIds: { type: array, items: { type: string }, uniqueItems: true }
    ProductWrite:
      type: object
      required: [title, priceMinor, currency, categoryId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        priceMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        categoryId: { type: integer, format: int64 }
        imageUrl: { type: string, format: uri }
    Product:
      allOf:
        - { $ref: '#/components/schemas/ProductWrite' }
        - type: object
          required: [id, version]
          properties:
            id: { type: integer, format: int64 }
            version: { type: integer, format: int64 }
    ProductPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        nextCursor: { type: [string, 'null'] }
    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1, maximum: 100 }
    Order:
      type: object
      required: [orderId, status, totalMinor, currency, version]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, PAYMENT_FAILED] }
        totalMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        version: { type: integer, format: int64 }
    OrderPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        nextCursor: { type: [string, 'null'] }
    CreatePaymentRequest:
      type: object
      required: [orderId]
      properties: { orderId: { type: string, format: uuid } }
    PaymentAttempt:
      type: object
      required: [paymentId, orderId, status, amountMinor, currency]
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, REQUIRES_ACTION, SUCCEEDED, FAILED, CANCELLED, UNKNOWN] }
        amountMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        redirectUrl: { type: [string, 'null'], format: uri }
    NotificationPreferences:
      type: object
      properties:
        emailEnabled: { type: boolean }
        pushEnabled: { type: boolean }
        webhookEnabled: { type: boolean }
        timezone: { type: string }
    NotificationEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [eventId, eventType, status, occurredAt]
            properties:
              eventId: { type: string, format: uuid }
              eventType: { type: string }
              status: { type: string }
              occurredAt: { type: string, format: date-time }
        nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        correlationId: { type: string }
        errors: { type: object, additionalProperties: { type: string } }
