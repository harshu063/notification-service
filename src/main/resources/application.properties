spring.application.name=notification-service
server.port=${NOTIFICATION_SERVER_PORT:8086}

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5434/notification_service}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:notification_user}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:replace-with-local-secret}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_KAFKA_GROUP:notification-service-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=record
notification.kafka.topic=${NOTIFICATION_KAFKA_TOPIC:platform.events.v1}
notification.kafka.group-id=${NOTIFICATION_KAFKA_GROUP:notification-service-v1}
notification.kafka.concurrency=${NOTIFICATION_KAFKA_CONCURRENCY:3}

logging.level.root=INFO
